name: Trans-Balkan Physics-Informed ML Deep Training

on:
  schedule:
    - cron: '0 11 * * *'      # Run every day at 12:00 CET (Macedonian Time, 11:00 UTC)
  workflow_dispatch:          # Or manual trigger at any time

permissions:
  contents: write

jobs:
  deep_train:
    runs-on: ubuntu-latest
    timeout-minutes: 180      # 3-hour safety guard

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install AI & Physics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lightgbm scikit-learn numpy scipy pandas requests

      - name: 4. Run Balkan Deep Trainer (160 Stations Ingestion & Ensemble Fit)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CREATOR_CHAT_ID: ${{ secrets.CREATOR_CHAT_ID }}
        run: |
          python -u balkan_deep_trainer.py

      - name: 5. Commit & Push Accuracy Report & Model Weights
        run: |
          git config --global user.name "Balkan-Meteo-AI-Engine"
          git config --global user.email "ai@balkan-meteo.org"
          git add accuracy_report.json balkan_weights.json stations_mesh_160.json || true
          git commit -m "Auto-retrain: Balkan 160-mesh 12-Year Physics Ensemble updated [skip ci]" || exit 0
          git push origin main
