name: Fast Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Pages
        uses: actions/configure-pages@v5

      - name: 3. Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 4. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
