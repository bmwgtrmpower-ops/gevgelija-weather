name: Trans-Balkan Physics-Informed ML Deep Training

on:
  schedule:
    - cron: '0 3 * * 0'      # Run every Sunday at 03:00 UTC
  workflow_dispatch:          # Or manual trigger at any time

permissions:
  contents: write

jobs:
  deep_train:
    runs-on: ubuntu-latest
    timeout-minutes: 180      # 3-hour safety guard

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install AI & Physics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lightgbm scikit-learn numpy scipy pandas

      - name: 4. Run Balkan Deep Trainer (160 Stations Ingestion & Ensemble Fit)
        run: |
          python -u balkan_deep_trainer.py

      - name: 5. Commit & Push Accuracy Report & Model
        run: |
          git config --global user.name "Balkan-Meteo-AI-Engine"
          git config --global user.email "ai@balkan-meteo.org"
          git add accuracy_report.json stations_mesh_160.json || true
          git commit -m "Auto-retrain: Balkan 160-mesh Physics-Informed Ensemble updated [skip ci]" || exit 0
          git push origin main
