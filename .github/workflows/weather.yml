name: Hourly Weather Collector

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weather collector
        run: python collector.py

      - name: Commit and push changes
        run: |
          git config user.name "Gevgelija Weather Bot"
          git config user.email "weatherbot@users.noreply.github.com"
          git add history.csv latest.json README.md
          git commit -m "Auto-update weather: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
